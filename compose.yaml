# Control plane only. Workers run on separate Linux hosts; see docs/DEPLOYMENT.md.
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rewind
      POSTGRES_USER: rewind
      POSTGRES_PASSWORD: ${REWIND_POSTGRES_PASSWORD:?Set a database password}
    volumes: [metadata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rewind -d rewind]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    env_file: .env
    environment:
      REWIND_DATABASE_URL: postgresql+psycopg://rewind:${REWIND_POSTGRES_PASSWORD}@database/rewind
      REWIND_MODEL_API_KEY: ""
      REWIND_DATA_DIR: /data
    ports: ["127.0.0.1:8080:8080"]
    volumes: [artifacts:/data]
    depends_on:
      database:
        condition: service_healthy
  migrate:
    build: .
    command: [rewind, migrate]
    env_file: .env
    environment:
      REWIND_DATABASE_URL: postgresql+psycopg://rewind:${REWIND_POSTGRES_PASSWORD}@database/rewind
      REWIND_DATA_DIR: /data
    volumes: [artifacts:/data]
    profiles: [setup]
    depends_on:
      database:
        condition: service_healthy
volumes:
  metadata:
  artifacts:
