[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rewind"
version = "0.1.0"
description = "Find the decision worth changing. Measure whether the change holds up."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0.38,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "httpx>=0.28,<1",
  "cryptography>=44,<47", "PyJWT[crypto]>=2.10,<3", "boto3>=1.37,<2",
  "docker>=7.1,<8",
]

[project.scripts]
rewind = "agent_rewind.cli:main"

[dependency-groups]
dev = ["ruff==0.11.13", "mypy==1.19.1", "pytest>=8.3,<10", "types-boto3[s3]>=1.37", "types-docker>=7"]

[tool.setuptools.packages.find]
include = ["agent_rewind*"]

[tool.setuptools.package-data]
agent_rewind = ["web/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
exclude = ["tests", "examples"]
